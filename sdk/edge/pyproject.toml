[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spaider-edge"
version = "0.1.0"
description = "On-device memory for robots: SQLite, spatial recall and sync to SpAIder"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Spaider Studio" }]
keywords = ["robotics", "memory", "edge", "sqlite"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["spaider_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
